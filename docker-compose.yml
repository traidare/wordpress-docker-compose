x-wp-common: &wp-common
  volumes:
    - ./config/wp_php.ini:/usr/local/etc/php/conf.d/conf.ini
    - ./wp-app:/var/www/html # Full wordpress project
    #- ./plugin-name/trunk/:/var/www/html/wp-content/plugins/plugin-name # Plugin development
    #- ./theme-name/trunk/:/var/www/html/wp-content/themes/theme-name # Theme development
  environment:
    WORDPRESS_DB_HOST: db
    WORDPRESS_DB_NAME: "${DB_NAME}"
    WORDPRESS_DB_USER: "${DB_USER}"
    WORDPRESS_DB_PASSWORD: "${DB_PASSWORD}"

services:
  wp:
    image: wordpress:latest # https://hub.docker.com/_/wordpress/
    <<: *wp-common
    ports:
      - ${IP}:${PORT}:80 # change ip if required
    depends_on:
      db:
        condition: service_healthy

  wpcli:
    image: wordpress:cli
    <<: *wp-common
    depends_on:
      db:
        condition: service_healthy
      wp:
        condition: service_started

  pma:
    image: phpmyadmin:latest  # https://hub.docker.com/_/phpmyadmin
    environment:
      # https://docs.phpmyadmin.net/en/latest/setup.html#docker-environment-variables
      PMA_HOST: db
      PMA_PORT: 3306 # port of the db backend, unrelated to the ${PMA_PORT} host binding below
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      UPLOAD_LIMIT: 50M
    ports:
      - ${IP}:${PMA_PORT}:80
    volumes:
      - ./config/pma_php.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./config/pma_config.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:latest # https://hub.docker.com/_/mariadb/ - or mysql https://hub.docker.com/_/mysql
    # platform: linux/x86_64  # Uncomment if your machine is running on arm (ex: Apple Silicon processor)
    ports:
      - ${IP}:${DB_PORT}:3306 # change ip if required
    command: [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci'
    ]
    volumes:
      - ./wp-data:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
